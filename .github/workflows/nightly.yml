name: Nightly quality

on:
  schedule:
    # Every night at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Test every mutant again, ignoring last night's results"
        type: boolean
        default: false

concurrency:
  group: nightly-quality
  cancel-in-progress: false

jobs:
  quality:
    name: Coverage & mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage
        run: pnpm coverage

      # Stryker reuses last night's results for mutants whose code and tests
      # haven't changed. A change to the dependencies or the test setup
      # starts afresh (the key), and so does every Sunday's run, since a
      # change elsewhere that the tests rely on goes unnoticed otherwise.
      - name: Restore last night's mutation results
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.json', 'vitest*.config.ts') }}-${{ github.run_id }}
          restore-keys: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.json', 'vitest*.config.ts') }}-

      - name: Mutation testing
        if: ${{ !cancelled() }}
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "true" ] || [ "$(date -u +%u)" = 7 ] || [ ! -f reports/stryker-incremental.json ]; then
            echo "_Full mutation run: every mutant was tested._" >> "$GITHUB_STEP_SUMMARY"
            pnpm mutation --force
          else
            echo "_Incremental mutation run: unchanged mutants keep last night's result._" >> "$GITHUB_STEP_SUMMARY"
            pnpm mutation
          fi

      - name: Save the mutation results for tomorrow
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.json', 'vitest*.config.ts') }}-${{ github.run_id }}

      - name: Job summary
        if: ${{ !cancelled() }}
        run: node tooling/quality-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
